name: Update Clash Subscription

on:
  schedule:
    # 每天北京时间早上 8:00 和晚上 20:00 自动运行（GitHub使用UTC时间，8:00 UTC = 16:00 北京时间）
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 允许手动点击按钮立即运行

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run fetch script
        run: python fetch_sub.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.yaml
          # 如果文件内容没有变化，跳过提交，直接退出
          if git diff --quiet && git diff --staged --quiet; then
            echo "文件没有变化，跳过提交"
          else
            git commit -m "Auto update subscription $(date +'%Y-%m-%d')"
            git push
          fi
